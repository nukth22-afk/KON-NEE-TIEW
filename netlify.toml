[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Proxy API และรูปภาพที่อัปโหลดไปยัง Backend (Cloud Run) ของ ฅนหนีเที่ยว
[[redirects]]
  from = "/api/*"
  to = "https://konneetiew.ai.studio/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://konneetiew.ai.studio/uploads/:splat"
  status = 200
  force = true

# SPA Fallback สำหรับ React Router / History API (/destinations, /about, /article/*, /admin)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
